# InfraMatrix — CloudPanel vhost (Reverse Proxy site)
# Single Node process on 127.0.0.1:3035 serves the whole app:
#   /            → React UI (apps/web/dist) with SPA fallback
#   /api/v1/...  → NestJS API
#   /uploads/... → uploaded files
#
# How to use in CloudPanel:
#   1. Sites → Add Site → "Create a Reverse Proxy"  (or PHP site, then replace the vhost)
#   2. Set the Domain Name to your new hostname and issue an SSL cert (Let's Encrypt).
#   3. Open the site → "Vhost" tab and paste this file, then Save.
#   The {{...}} tokens are CloudPanel template variables — leave them as-is; CloudPanel
#   fills them in. Only the app port (3035) and server_name are app-specific.

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  # ↓↓↓ change this to your NEW hosting domain ↓↓↓
  server_name inframatrix.example.com;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  include /etc/nginx/global_settings;

  index index.html;

  # Allow larger request bodies for file uploads (logos, attachments, xlsx import).
  client_max_body_size 25m;

  location / {
    proxy_pass http://127.0.0.1:3035/;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_pass_request_headers on;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 900;
    proxy_send_timeout 900;
    proxy_read_timeout 900;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_temp_file_write_size 256k;
  }
}
